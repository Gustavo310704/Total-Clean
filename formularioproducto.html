    <div class="form-container">
        <form action="agregar_producto.php" method="POST" id="formProducto">
            <h1>Agregar Producto</h1>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" maxlength="100" required>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" required></textarea>

            <label for="idCategoria">Categoría:</label>
            <select id="idCategoria" name="idCategoria" required>
                <option value="">Cargando categorías...</option>
            </select>

            <label for="idMarca">Marca:</label>
            <select id="idMarca" name="idMarca" required>
                <option value="">Cargando marcas...</option>
            </select>

            <label for="idFabricante">Fabricante:</label>
            <select id="idFabricante" name="idFabricante" required>
                <option value="">Cargando fabricantes...</option>
            </select>

            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" min="0" required>

            <label for="precio_unitario">Precio Unitario:</label>
            <input type="number" id="precio_unitario" name="precio_unitario" step="0.01" min="0" required>

            <label for="fecha_vencimiento">Fecha de Vencimiento:</label>
            <input type="date" id="fecha_vencimiento" name="fecha_vencimiento" required>

            <input type="submit" value="Agregar Producto">
        </form>

    <div class="table-container">
        <table id="tablaProductosDT" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th>Marca</th>
                    <th>Stock</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Se cargará por AJAX -->
            </tbody>
        </table>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Cargar datos de los selectores
        function cargarSelectores() {
            // Cargar categorías
            $.getJSON('obtener_categoria.php', function(data) {
                let options = '<option value="">Seleccione categoría</option>';
                $.each(data.data, function(key, categoria) {
                    options += `<option value="${categoria.idCategoria}">${categoria.nombre}</option>`;
                });
                $('#idCategoria').html(options);
            });
            
            // Cargar marcas
            $.getJSON('obtener_marcas.php', function(data) {
                let options = '<option value="">Seleccione marca</option>';
                $.each(data.data, function(key, marca) {
                    options += `<option value="${marca.idMarca}">${marca.nombre}</option>`;
                });
                $('#idMarca').html(options);
            });
            
            // Cargar fabricantes
            $.getJSON('obtener_fabricantes.php', function(data) {
                let options = '<option value="">Seleccione fabricante</option>';
                $.each(data.data, function(key, fabricante) {
                    options += `<option value="${fabricante.idFabricante}">${fabricante.nombre}</option>`;
                });
                $('#idFabricante').html(options);
            });
        }
        
        // Inicializar DataTable
        var tabla = $('#tablaProductosDT').DataTable({
            ajax: {
                url: 'obtener_productos.php',
                dataSrc: ''
            },
            columns: [
                { data: 'idProducto' },
                { data: 'nombre' },
                { data: 'descripcion' },
                { data: 'categoria' },
                { data: 'marca' },
                { data: 'stock' },
                { 
                    data: 'precio_unitario',
                    render: function(data, type, row) {
                        return '$' + parseFloat(data).toFixed(2);
                    }
                },
                {
                    data: null,
                    render: function (data, type, row) {
                        return `
                            <a href="editar_producto.php?id=${row.idProducto}" class="btn-warning me-1">Editar</a>
                            <button class="btn-warning btnEliminar" style="background-color: #dc3545" data-id="${row.idProducto}">Eliminar</button>
                        `;
                    },
                    orderable: false,
                    searchable: false
                }
            ],
            dom: 'Bfrtip',
            buttons: [
                {
                    extend: 'excelHtml5',
                    text: 'Exportar a Excel',
                    className: 'btn-warning',
                    exportOptions: { columns: [0,1,2,3,4,5,6] }
                },
                {
                    extend: 'pdfHtml5',
                    text: 'Exportar a PDF',
                    className: 'btn-warning',
                    exportOptions: { columns: [0,1,2,3,4,5,6] }
                },
                {
                    extend: 'print',
                    text: 'Imprimir',
                    className: 'btn-warning',
                    exportOptions: { columns: [0,1,2,3,4,5,6] }
                }
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json'
            }
        });

        // Manejar eliminación de productos
        $(document).on('click', '.btnEliminar', function() {
            var id = $(this).data('id');
            
            if (confirm('¿Está seguro de eliminar este producto?')) {
                $.ajax({
                    url: 'eliminar_producto.php',
                    method: 'POST',
                    data: { id: id },
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            tabla.ajax.reload();
                        } else {
                            alert('Error: ' + response.error);
                        }
                    },
                    error: function() {
                        alert('Error al comunicarse con el servidor');
                    }
                });
            }
        });

        // Cargar los selectores al inicio
        cargarSelectores();
        
        // Validación del formulario
        $('#formProducto').on('submit', function(e) {
            let valid = true;
            
            // Validar campos obligatorios
            $(this).find('[required]').each(function() {
                if (!$(this).val()) {
                    alert(`El campo ${$(this).prev('label').text()} es obligatorio`);
                    $(this).focus();
                    valid = false;
                    return false; // Salir del each
                }
            });
            
            if (!valid) {
                e.preventDefault();
                return false;
            }
            
            // Validar fechas
            const fechaVencimiento = new Date($('#fecha_vencimiento').val());
            const hoy = new Date();
            
            if (fechaVencimiento < hoy) {
                alert('La fecha de vencimiento no puede ser anterior a hoy');
                $('#fecha_vencimiento').focus();
                e.preventDefault();
                return false;
            }
            
            return true;
        });
    });
</script>
