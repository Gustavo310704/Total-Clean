<script>
    let idEliminar = null;

    document.addEventListener('click', function(e){
        if(e.target.classList.contains('btnEliminar')){
            idEliminar = e.target.getAttribute('data-id');
            let nombre = e.target.getAttribute('data-nombre');
            document.getElementById('textoModal').textContent = '¿Estás seguro de eliminar al usuario: ' + nombre + '?';
            document.getElementById('modalEliminar').style.display = 'block';
        }
    });

    document.querySelector('.close').onclick = function() {
        document.getElementById('modalEliminar').style.display = 'none';
    }

    document.getElementById('btnCancelar').onclick = function() {
        document.getElementById('modalEliminar').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('modalEliminar')) {
            document.getElementById('modalEliminar').style.display = 'none';
        }
    }

    document.getElementById('btnConfirmarEliminar').onclick = function() {
        if(idEliminar){
            fetch('eliminar_usuario.php?id=' + idEliminar, {
                method: 'GET'
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('modalEliminar').style.display = 'none';
                $('#tablaUsuarios').DataTable().ajax.reload(null, false);
            })
            .catch(error => console.error('Error:', error));
        }
    }
</script>
